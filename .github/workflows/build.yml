name: Autobuild APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Generate Android Scaffolding
      run: |
        flutter create temp_app --org com.optic.analyzer --project-name smart_image_analyzer
        mv temp_app/android ./android
        mv temp_app/ios ./ios
        rm -rf temp_app
        
    - name: Install Dependencies
      run: |
        flutter pub get
        flutter pub run build_runner build --delete-conflicting-outputs

    - name: Build APK File
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Optic-AI-App
        path: build/app/outputs/flutter-apk/app-release.apk
